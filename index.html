<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="description" content="A calm study companion for focused practice and steady progress.">
  <title>StudyLoop — your next good session</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8M8 11h8"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10m8 10V4m8 16v-7"/><path d="M2.5 20.5h19"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 9.5h16M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.8 7.2L21 12l-7.2 1.8L12 21l-1.8-7.2L3 12l7.2-2.8z"/><path d="m19 2 .8 2.2L22 5l-2.2.8L19 8l-.8-2.2L16 5l2.2-.8z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4.4 0 7.5-3.1 7.5-7.2 0-3.1-1.8-5.2-4.1-7.3.1 2.2-.8 3.3-1.7 3.8C14.1 7.2 12.1 3.8 8 2c.4 4.8-3.5 7.5-3.5 12.7C4.5 18.8 7.6 22 12 22Z"/><path d="M12 22c-2 0-3.3-1.4-3.3-3.2 0-1.5.9-2.6 2.3-3.8.1 1.1.5 1.7 1.1 2 .2-1.6 1.1-2.8 2.2-3.6.8 1.1 1.5 2.6 1.5 4.1 0 2.6-1.7 4.5-3.8 4.5Z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20.5 3.5c-10 0-16 4-16 11a6 6 0 0 0 6 6c7 0 11-6 10-17Z"/><path d="M4.5 20.5c2-5 5-8 10-11"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#today" aria-label="StudyLoop home"><span class="brand-mark"><svg><use href="#i-leaf"/></svg></span><span>study<span class="brand-light">loop</span></span></a>
      <div class="side-label">YOUR DESK</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="today"><svg><use href="#i-grid"/></svg><span>Today</span><span class="nav-dot"></span></button>
        <button class="nav-item" data-page="study"><svg><use href="#i-book"/></svg><span>Study methods</span></button>
        <button class="nav-item" data-page="ai"><svg><use href="#i-spark"/></svg><span>AI study tools</span></button>
        <button class="nav-item" data-page="quizzes"><svg><use href="#i-check"/></svg><span>Quizzes</span><span class="nav-count" id="nav-due">6</span></button>
        <button class="nav-item" data-page="planner"><svg><use href="#i-calendar"/></svg><span>Planner</span></button>
        <button class="nav-item" data-page="progress"><svg><use href="#i-chart"/></svg><span>Progress</span></button>
      </nav>
      <div class="side-label subject-label">YOUR SUBJECTS <button class="tiny-add" id="add-subject" aria-label="Add subject">+</button></div>
      <div class="subject-list" id="subject-list"></div>
      <div class="sidebar-bottom">
        <button class="profile-button" data-page="settings"><span class="avatar" id="profile-initial">S</span><span class="profile-copy"><strong id="profile-name">Study profile</strong><small id="profile-year">Set up your details</small></span><span class="profile-more">···</span></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button id="menu-toggle" class="icon-button mobile-menu" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button><div class="breadcrumb"><span>My space</span><span class="crumb-slash">/</span><strong id="page-title">Today</strong></div><div class="topbar-right"><span class="streak-pill"><svg><use href="#i-flame"/></svg><b id="streak-count">0</b><span>day streak</span></span><button class="avatar small-avatar" data-page="settings" aria-label="Your profile" id="top-avatar">S</button></div></header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
